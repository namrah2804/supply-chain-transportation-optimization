<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="35" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Base Model — Cost by Route Type (Total £1,640,500)</text>

  <!-- axis -->
  <line x1="90" y1="340" x2="850" y2="340" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- bars: max value 846500 -> scale to 260px height -->
  <!-- Factory->Warehouse 183250 -->
  <g>
    <rect x="150" y="284" width="140" height="56" fill="#16a34a" rx="4"/>
    <text x="220" y="270" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">£183,250</text>
    <text x="220" y="365" font-size="13" fill="#374151" text-anchor="middle">Factory →</text>
    <text x="220" y="382" font-size="13" fill="#374151" text-anchor="middle">Warehouse</text>
  </g>

  <!-- Warehouse->Retailer 846500 (tallest, 260px) -->
  <g>
    <rect x="380" y="80" width="140" height="260" fill="#d97706" rx="4"/>
    <text x="450" y="66" font-size="14" font-weight="600" fill="#78350f" text-anchor="middle">£846,500</text>
    <text x="450" y="365" font-size="13" fill="#374151" text-anchor="middle">Warehouse →</text>
    <text x="450" y="382" font-size="13" fill="#374151" text-anchor="middle">Retailer</text>
  </g>

  <!-- Factory->Retailer direct 610750 -->
  <g>
    <rect x="610" y="152" width="140" height="188" fill="#2563eb" rx="4"/>
    <text x="680" y="138" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">£610,750</text>
    <text x="680" y="365" font-size="13" fill="#374151" text-anchor="middle">Direct Factory →</text>
    <text x="680" y="382" font-size="13" fill="#374151" text-anchor="middle">Retailer</text>
  </g>
</svg>
